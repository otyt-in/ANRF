<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aranya Niran Rosewood Foundation</title>
    <meta name="description" content="ANRF conserves East Indian Rosewood and supports rural women around Sanavalli, Mundgod, Karnataka." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..800,40,0..1&family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --canopy: #102d22;
        --deep: #071611;
        --moss: #55745a;
        --sage: #bac7a7;
        --ochre: #c8803e;
        --rosewood: #6f3024;
        --paper: #f5efe3;
        --bone: #fffaf0;
        --ink: #1e2521;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif; }
      a { color: inherit; text-decoration: none; }
      .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(rgba(7,22,17,.82), rgba(7,22,17,.22), transparent); }
      .nav-inner { max-width: 1220px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
      .brand { font-family: "Fraunces", Georgia, serif; font-size: 25px; font-weight: 700; letter-spacing: .01em; }
      .links { display: flex; gap: 24px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .11em; }
      .hero { min-height: 94vh; position: relative; overflow: hidden; background: var(--deep); color: white; }
      .hero:before { content: ""; position: absolute; inset: 0; background: url("https://images.unsplash.com/photo-1473773508845-188df298d2d1?auto=format&fit=crop&w=2200&q=82") center/cover; opacity: .74; transform: scale(1.02); }
      .hero:after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,22,17,.95), rgba(16,45,34,.58) 44%, rgba(7,22,17,.1)), linear-gradient(0deg, rgba(7,22,17,.98), transparent 42%); }
      .hero-inner { position: relative; z-index: 2; min-height: 94vh; max-width: 1220px; margin: 0 auto; padding: 116px 20px 44px; display: grid; grid-template-columns: minmax(0, 1.1fr) 360px; gap: 48px; align-items: end; }
      .eyebrow { margin: 0 0 18px; color: rgba(245,239,227,.82); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; font-weight: 900; }
      h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 650; letter-spacing: 0; font-variation-settings: "SOFT" 40, "WONK" .35; }
      h1 { max-width: 820px; margin: 0; font-size: clamp(50px, 7.4vw, 102px); line-height: .9; }
      .lead { max-width: 650px; margin: 26px 0 0; font-size: 18px; line-height: 1.65; color: rgba(255,250,240,.9); }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; font-weight: 800; font-size: 13px; border: 1px solid rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .08em; }
      .button.primary { background: var(--bone); color: var(--canopy); border-color: var(--bone); }
      .hero-panel { border-left: 1px solid rgba(255,255,255,.3); padding-left: 26px; }
      .hero-panel strong { display: block; font-family: "Fraunces", Georgia, serif; font-size: 60px; font-weight: 750; line-height: .9; color: var(--sage); }
      .hero-panel span { display: block; margin-top: 12px; color: rgba(255,250,240,.8); line-height: 1.7; }
      .section { padding: 92px 20px; }
      .wrap { max-width: 1220px; margin: 0 auto; }
      .section-title { max-width: 800px; margin: 0; color: var(--canopy); font-size: clamp(40px, 5.2vw, 70px); line-height: .94; }
      .intro-grid { display: grid; grid-template-columns: .7fr 1.3fr; gap: 54px; align-items: start; }
      .kicker { color: var(--ochre); font-size: 11px; letter-spacing: .25em; text-transform: uppercase; font-weight: 900; }
      .body-copy { color: rgba(30,37,33,.76); font-size: 18px; line-height: 1.72; max-width: 680px; }
      .impact-strip { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid rgba(16,45,34,.18); border-bottom: 1px solid rgba(16,45,34,.18); margin-top: 54px; }
      .impact { padding: 28px 24px; border-right: 1px solid rgba(16,45,34,.16); }
      .impact:last-child { border-right: 0; }
      .impact strong { display: block; color: var(--rosewood); font-family: "Fraunces", Georgia, serif; font-size: 44px; font-weight: 750; line-height: .9; }
      .impact span { display: block; margin-top: 10px; font-size: 13px; font-weight: 800; line-height: 1.5; text-transform: uppercase; letter-spacing: .08em; color: rgba(30,37,33,.66); }
      .work { background: var(--canopy); color: white; position: relative; overflow: hidden; }
      .work:before { content: ""; position: absolute; inset: 0; background: url("https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2200&q=82") center/cover; opacity: .2; }
      .work .wrap { position: relative; z-index: 1; }
      .work .section-title { color: white; }
      .work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 42px; }
      .work-card { min-height: 430px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; padding: 34px; border: 1px solid rgba(255,255,255,.18); }
      .work-card:before { content: ""; position: absolute; inset: 0; background: var(--img) center/cover; opacity: .76; transition: transform .5s ease; }
      .work-card:after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,22,17,.94), rgba(7,22,17,.25)); }
      .work-card:hover:before { transform: scale(1.04); }
      .work-card > * { position: relative; z-index: 1; }
      .work-card h3 { margin: 0; font-size: 45px; line-height: .94; }
      .work-card p { max-width: 530px; color: rgba(255,250,240,.84); font-size: 16px; line-height: 1.75; }
      .timeline { background: var(--bone); }
      .timeline-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 58px; align-items: center; }
      .rings { min-height: 440px; background: radial-gradient(circle, transparent 0 18%, rgba(111,48,36,.24) 18.5% 19%, transparent 19.5% 32%, rgba(111,48,36,.22) 32.5% 33%, transparent 33.5% 48%, rgba(111,48,36,.18) 48.5% 49%, transparent 49.5% 63%, rgba(111,48,36,.14) 63.5% 64%, transparent 64.5%), url("https://images.unsplash.com/photo-1535982330050-f1c2fb79ff78?auto=format&fit=crop&w=1200&q=82") center/cover; border: 18px solid var(--paper); box-shadow: 0 30px 70px rgba(16,45,34,.18); }
      .video { background: var(--deep); color: white; }
      .video-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; }
      .video-box { aspect-ratio: 16 / 9; position: relative; background: #000; overflow: hidden; box-shadow: 0 35px 90px rgba(0,0,0,.34); }
      .video-box:before { content: ""; position: absolute; inset: 0; background: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=82") center/cover; opacity: .82; }
      .play { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; background: var(--bone); color: var(--canopy); display: grid; place-items: center; font-size: 30px; }
      .stories { background: var(--paper); }
      .story-grid { display: grid; grid-template-columns: .68fr 1.32fr; gap: 42px; }
      .story-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .story { min-height: 300px; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; color: white; position: relative; overflow: hidden; background: var(--canopy); }
      .story:before { content: ""; position: absolute; inset: 0; background: var(--img) center/cover; opacity: .65; transition: transform .5s ease; }
      .story:after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,22,17,.92), rgba(7,22,17,.18)); }
      .story:hover:before { transform: scale(1.05); }
      .story > * { position: relative; z-index: 1; }
      .story h3 { margin: 16px 0 10px; font-size: 25px; line-height: 1.05; }
      .story p:last-child { color: rgba(255,250,240,.82); line-height: 1.6; }
      .page { min-height: 100vh; padding: 130px 20px 80px; background: var(--paper); }
      .page-card { max-width: 980px; margin: 0 auto; background: var(--bone); padding: 52px; border-top: 10px solid var(--canopy); box-shadow: 0 24px 70px rgba(16,45,34,.12); }
      .page-card h1 { color: var(--canopy); font-size: clamp(44px, 6vw, 76px); line-height: .94; }
      .page-card p { font-size: 18px; line-height: 1.85; color: rgba(30,37,33,.76); }
      .story-list.page-list { margin-top: 32px; }
      @media (max-width: 900px) {
        .links { display: none; }
        .hero-inner, .intro-grid, .work-grid, .timeline-grid, .video-grid, .story-grid, .story-list, .impact-strip { grid-template-columns: 1fr; }
        .hero-panel { border-left: 0; border-top: 1px solid rgba(255,255,255,.32); padding-left: 0; padding-top: 24px; }
        .impact { border-right: 0; border-bottom: 1px solid rgba(16,45,34,.16); }
        .work-card { min-height: 350px; }
        .rings { min-height: 320px; }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="nav-inner">
        <a href="/" class="brand">ANRF</a>
        <div class="links">
          <a href="/about">About</a>
          <a href="/work">What We Do</a>
          <a href="/stories">Stories</a>
          <a href="/contact">Contact</a>
        </div>
      </div>
    </nav>
    <main id="app"></main>
    <script>
      const storyImages = [
        "url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=900&q=82')",
        "url('https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=900&q=82')",
        "url('https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=900&q=82')"
      ];
      const stories = [
        ["Field update", "Planting Hope, One Rosewood at a Time", "More than 2,000 East Indian Rosewood saplings are already rooted on ANRF farmland.", "/stories/planting-hope-one-rosewood-at-a-time"],
        ["Documentation", "Why Rosewood Needs a Field Guide", "ANRF’s long-term ambition is to document regeneration methods that can support wider conservation.", "/stories/why-east-indian-rosewood-needs-documentation"],
        ["Social support", "Naya Nari: Women Design a New Path", "Craft, stitching and exhibitions become a small but real platform for confidence and income.", "/stories/naya-nari-where-nature-inspires-women-design"]
      ];
      const fileMode = location.protocol === "file:";
      const path = fileMode ? (location.hash.slice(1).replace(/\/$/, "") || "/") : (location.pathname.replace(/\/$/, "") || "/");
      const app = document.querySelector("#app");
      const storyCards = stories.map(([cat, title, copy, href], index) => `<a class="story" href="${href}" style="--img:${storyImages[index]}"><p class="eyebrow">${cat}</p><h3>${title}</h3><p>${copy}</p></a>`).join("");
      const page = (label, title, body) => `<section class="page"><div class="page-card"><p class="kicker">${label}</p><h1>${title}</h1>${body}</div></section>`;
      if (path === "/") {
        app.innerHTML = `
          <section class="hero"><div class="hero-inner"><div><p class="eyebrow">Sanavalli, Mundgod, Karnataka</p><h1>Where Nature & Communities Thrive</h1><p class="lead">A 100-year conservation effort for East Indian Rosewood, paired with rural women’s empowerment around the land that sustains it.</p><div class="actions"><a class="button primary" href="/work/rosewood-conservation">Explore the work</a><a class="button" href="/stories">Read field stories</a></div></div><aside class="hero-panel"><strong>100</strong><span>Years for a rosewood tree to reach maturity. ANRF is building for that horizon, not for a campaign cycle.</span></aside></div></section>
          <section class="section"><div class="wrap intro-grid"><div><p class="kicker">The model</p><h2 class="section-title">Conservation that begins with land, science and community.</h2></div><div><p class="body-copy">ANRF was born from a long relationship with East Indian Rosewood and the people around Mundgod. The work now joins farmland reforestation, nursery development, pilot forest plots, documentation and Naya Nari’s rural empowerment initiative.</p><div class="impact-strip"><div class="impact"><strong>2000+</strong><span>Rosewood saplings planted</span></div><div class="impact"><strong>30</strong><span>Acres secured near Mundgod</span></div><div class="impact"><strong>2</strong><span>Forest pilot plots identified</span></div><div class="impact"><strong>1</strong><span>Women-led initiative growing</span></div></div></div></div></section>
          <section class="section work"><div class="wrap"><p class="eyebrow">What we do</p><h2 class="section-title">Two threads, one foundation.</h2><div class="work-grid"><a class="work-card" href="/work/rosewood-conservation" style="--img:url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=82')"><h3>Rosewood Conservation</h3><p>Farmland planting, nursery care, pilot forest plots and documentation for East Indian Rosewood regeneration.</p></a><a class="work-card" href="/work/social-support" style="--img:url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1200&q=82')"><h3>Social Support</h3><p>Naya Nari supports women around Sanavalli through craft skills, exhibitions and alternative income pathways.</p></a></div></div></section>
          <section class="section timeline"><div class="wrap timeline-grid"><div class="rings"></div><div><p class="kicker">The long view</p><h2 class="section-title">A rosewood tree asks for patience.</h2><p class="body-copy">ANRF’s digital home should feel the same: grounded, patient, field-based and credible. The CMS will let the foundation publish updates, documentation, videos and photo essays as the work unfolds over years.</p></div></div></section>
          <section class="section video"><div class="wrap video-grid"><div class="video-box"><div class="play">▶</div></div><div><p class="eyebrow">Video</p><h2 class="section-title" style="color:white">Show the field, not just the mission.</h2><p class="lead">The homepage is prepared for your ANRF film. Later, Sanity can control the video URL, poster image and supporting copy.</p></div></div></section>
          <section class="section stories"><div class="wrap story-grid"><div><p class="kicker">Stories</p><h2 class="section-title">A content hub for blogs, field notes, documents and media.</h2></div><div class="story-list">${storyCards}</div></div></section>`;
      } else if (path === "/about") {
        app.innerHTML = page("About us", "A foundation born from a long relationship with East Indian Rosewood.", "<p>Aranya Niran Rosewood Foundation grew from Overseas Traders, a third-generation family business working with East Indian Rosewood for more than 40 years.</p><p>ANRF is located near Sanavalli, Mundgod, Karnataka, in the native region for East Indian Rosewood. The foundation has secured farmland, planted saplings, built nursery capacity and begun collaboration around forest pilot plots.</p>");
      } else if (path === "/work") {
        app.innerHTML = page("What we do", "Conservation and community support, designed to last.", "<p><a href='/work/rosewood-conservation'>Rosewood Conservation</a>: reforestation, nursery development, pilot forest plots and conservation documentation.</p><p><a href='/work/social-support'>Social Support</a>: Naya Nari promotes rural empowerment by helping local women build practical skills and financial confidence.</p>");
      } else if (path === "/work/rosewood-conservation") {
        app.innerHTML = page("Rosewood conservation", "Protecting East Indian Rosewood through planting, study and field documentation.", "<p>ANRF has planted more than 2,000 rosewood saplings, built nursery capacity and started work around pilot forest plots with scientific and institutional collaboration.</p>");
      } else if (path === "/work/social-support") {
        app.innerHTML = page("Social support", "Naya Nari helps women around Sanavalli build skill, confidence and income pathways.", "<p>Naya Nari is ANRF's rural empowerment initiative. Women learn stitching and craft skills, participate in exhibitions and begin to build alternatives for financial independence.</p>");
      } else if (path === "/stories") {
        app.innerHTML = page("Stories", "Blogs, documentation, photo stories and videos.", `<div class="story-list page-list">${storyCards}</div>`);
      } else if (path === "/contact") {
        app.innerHTML = page("Contact", "Connect with Aranya Niran Rosewood Foundation.", "<p>Location: Sanavalli, Mundgod, Karnataka, India.</p><p>Contact form and email details can be added once the preferred public contact address is confirmed.</p>");
      } else if (path === "/studio") {
        app.innerHTML = page("Sanity Studio", "CMS route reserved.", "<p>After a Sanity project is created and dependencies are installed, this route can host the embedded CMS editor for ANRF content.</p>");
      } else {
        const story = stories.find((item) => item[3] === path);
        app.innerHTML = story ? page(story[0], story[1], `<p>${story[2]}</p><p>This is starter content. Once Sanity is connected, this page will render editable story body content, galleries, video embeds and attached documents.</p>`) : page("404", "Page not found.", "<p>This route has not been added yet.</p>");
      }
      if (fileMode) {
        document.addEventListener("click", (event) => {
          const link = event.target.closest("a[href^='/']");
          if (!link) return;
          event.preventDefault();
          location.hash = link.getAttribute("href");
          location.reload();
        });
      }
    </script>
  </body>
</html>
